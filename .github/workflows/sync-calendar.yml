name: Sync Calendar ICS

on:
  schedule:
    - cron: '0 * * * *' # Automatically runs every hour
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  build-ics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Firestore Data and Generate ICS
        run: |
          cat << 'EOF' > generate-ics.js
          const fs = require("fs");
          const https = require("https");

          const PROJECT_ID = "bailey-family-planner";
          const url = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/family_data/planner`;

          // Helper to escape special iCal characters
          function escapeICS(str) {
            return (str || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
          }

          https.get(url, (res) => {
            let body = "";
            res.on("data", chunk => body += chunk);
            res.on("end", () => {
              try {
                const data = JSON.parse(body);
                const fields = data.fields || {};
                const eventsArray = fields.events?.arrayValue?.values || [];
                
                let icsContent = [
                  "BEGIN:VCALENDAR",
                  "VERSION:2.0",
                  "PRODID:-//Bailey Family Planner//EN",
                  "CALSCALE:GREGORIAN",
                  "METHOD:PUBLISH",
                  "X-WR-CALNAME:Bailey Family Calendar",
                  "X-WR-TIMEZONE:America/New_York"
                ];

                eventsArray.forEach(ev => {
                  const m = ev.mapValue?.fields || {};
                  const title = m.title?.stringValue || "Event";
                  const dateStr = m.date?.stringValue || "";
                  const timeStr = m.time?.stringValue || "07:30";
                  const durationStr = m.duration?.stringValue || "1h";
                  const details = m.details?.stringValue || "";
                  const attendees = m.attendees?.stringValue || "";
                  const shiftFor = m.shiftFor?.stringValue || "";
                  const id = m.id?.stringValue || Math.random().toString(36).substring(2, 9);

                  if (dateStr) {
                    icsContent.push("BEGIN:VEVENT");
                    icsContent.push(`UID:${id}@bailey-family-planner`);
                    icsContent.push(`DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").split(".")[0]}Z`);
                    
                    if (durationStr === "All Day") {
                      const cleanDate = dateStr.replace(/-/g, "");
                      icsContent.push(`DTSTART;VALUE=DATE:${cleanDate}`);
                      icsContent.push(`DURATION:P1D`);
                    } else {
                      // Convert local time to UTC for bulletproof Outlook compatibility
                      // Assume Eastern Time (UTC-4 in Daylight Saving Time)
                      const localDateObj = new Date(`${dateStr}T${timeStr}:00-04:00`);
                      const startUTC = localDateObj.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
                      const hours = parseInt(durationStr) || 1;
                      
                      const endLocalDateObj = new Date(localDateObj.getTime() + (hours * 3600000));
                      const endUTC = endLocalDateObj.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";

                      icsContent.push(`DTSTART:${startUTC}`);
                      icsContent.push(`DTEND:${endUTC}`);
                    }

                    let summary = title;
                    if (shiftFor) summary += ` (Covering for ${shiftFor})`;
                    icsContent.push(`SUMMARY:${escapeICS(summary)}`);

                    let descParts = [];
                    if (attendees) descParts.push(`Attendees: ${attendees}`);
                    if (shiftFor) descParts.push(`Shift for: ${shiftFor}`);
                    if (details) descParts.push(`Notes: ${details}`);
                    if (descParts.length > 0) {
                      icsContent.push(`DESCRIPTION:${escapeICS(descParts.join(" | "))}`);
                    }

                    icsContent.push("END:VEVENT");
                  }
                });

                icsContent.push("END:VCALENDAR");
                fs.writeFileSync("calendar.ics", icsContent.join("\r\n"));
                console.log("Successfully generated UTC calendar.ics");
              } catch (e) {
                console.error("Error generating ICS:", e);
                process.exit(1);
              }
            });
          }).on("error", (err) => {
            console.error("HTTP Error:", err);
            process.exit(1);
          });
          EOF
          node generate-ics.js

      - name: Commit and Push Updated ICS
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add calendar.ics
          git commit -m "Auto-update live calendar.ics with pure UTC event times" || exit 0
          git push
